<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Obsidian Apple Liquid Glass Base -->
    <linearGradient id="bgBase" x1="48" y1="24" x2="464" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A243B" />
      <stop offset="50%" stop-color="#0E1320" />
      <stop offset="100%" stop-color="#07090F" />
    </linearGradient>

    <!-- Subtle Liquid Refraction Glows -->
    <radialGradient id="glowTopLeft" cx="0.22" cy="0.18" r="0.65">
      <stop offset="0%" stop-color="#64D2FF" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#64D2FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowBottomRight" cx="0.82" cy="0.85" r="0.65">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.36" />
      <stop offset="100%" stop-color="#5E5CE6" stop-opacity="0" />
    </radialGradient>

    <!-- Curved Specular Top Catchlight -->
    <linearGradient id="topSheen" x1="256" y1="20" x2="256" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.24" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Beveled Specular Rim Border -->
    <linearGradient id="rimGrad" x1="256" y1="12" x2="256" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#64D2FF" stop-opacity="0.45" />
    </linearGradient>

    <!-- < and /> Syntax Bracket Accent -->
    <linearGradient id="bracketGrad" x1="58" y1="184" x2="454" y2="328" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64D2FF" />
      <stop offset="100%" stop-color="#0A84FF" />
    </linearGradient>

    <!-- BB Core Monogram Gradient -->
    <linearGradient id="bbGrad" x1="256" y1="176" x2="256" y2="336" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D8E2F2" />
    </linearGradient>

    <filter id="textGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0A84FF" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- macOS Squircle Base -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="url(#bgBase)" />
  <rect x="12" y="12" width="488" height="488" rx="116" fill="url(#glowTopLeft)" />
  <rect x="12" y="12" width="488" height="488" rx="116" fill="url(#glowBottomRight)" />

  <!-- Top Liquid Glass Specular Curve -->
  <path d="M 128 16 H 384 C 446 16, 496 66, 496 128 V 206 C 390 250, 122 250, 16 206 V 128 C 16 66, 66 16, 128 16 Z" fill="url(#topSheen)" />

  <!-- Specular Glass Rim -->
  <rect x="14" y="14" width="484" height="484" rx="114" stroke="url(#rimGrad)" stroke-width="4" />

  <!-- Crisp <BB/> Vector Mark -->
  <g filter="url(#textGlow)">
    <!-- < -->
    <path d="M 106 206 L 58 256 L 106 306" stroke="url(#bracketGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

    <!-- First B -->
    <path d="M 138 192 V 320 M 138 192 H 174 C 200 192, 200 252, 172 252 H 138 M 138 252 H 178 C 208 252, 208 320, 178 320 H 138"
          stroke="url(#bbGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Second B -->
    <path d="M 240 192 V 320 M 240 192 H 276 C 302 192, 302 252, 274 252 H 240 M 240 252 H 280 C 310 252, 310 320, 280 320 H 240"
          stroke="url(#bbGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

    <!-- / -->
    <path d="M 384 192 L 348 320" stroke="url(#bracketGrad)" stroke-width="22" stroke-linecap="round" />

    <!-- > -->
    <path d="M 406 206 L 454 256 L 406 306" stroke="url(#bracketGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
