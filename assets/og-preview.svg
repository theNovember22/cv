<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlow" cx="20%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#142642" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0A0E18" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#05070B" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="100%" stop-color="#64D2FF" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30D158" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="1200" height="630" fill="url(#bgGlow)" />

  <!-- Subtle Blueprint Grid Pattern -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
  </g>

  <!-- Main Frosted Glass Editorial Frame -->
  <rect x="70" y="55" width="1060" height="520" rx="28" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5" filter="url(#dropShadow)" />

  <!-- Inner Top Navigation Bar / Brand -->
  <g transform="translate(120, 110)">
    <!-- Brand Badge -->
    <rect width="44" height="44" rx="12" fill="rgba(10,132,255,0.18)" stroke="#0A84FF" stroke-width="1.2" />
    <text x="22" y="27" fill="#64D2FF" font-size="16" font-weight="800" text-anchor="middle" font-family="ui-monospace, monospace">&lt;B/&gt;</text>
    
    <text x="58" y="22" fill="#FFFFFF" font-size="20" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif">Battula Bhargav</text>
    <text x="58" y="40" fill="#8E8E93" font-size="13" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif">M.Tech CSE Scholar @ NIT Goa &bull; Ex-Systems Engineer @ Infosys</text>

    <!-- Status Pill -->
    <rect x="750" y="6" width="150" height="32" rx="16" fill="rgba(48,209,88,0.12)" stroke="rgba(48,209,88,0.3)" stroke-width="1"/>
    <circle cx="766" cy="22" r="4" fill="#30D158" />
    <text x="778" y="26" fill="#30D158" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif">Available &bull; 2026</text>
  </g>

  <!-- Headline Section -->
  <g transform="translate(120, 220)">
    <text x="0" y="44" fill="#FFFFFF" font-size="44" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" letter-spacing="-0.03em">
      I build intelligent systems that know
    </text>
    <text x="0" y="100" fill="url(#blueGrad)" font-size="44" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" letter-spacing="-0.03em">
      when not to trust themselves.
    </text>
    <text x="0" y="152" fill="#AEAEB2" font-size="19" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" letter-spacing="-0.01em">
      Specializing in Reliability-Aware Active Learning, Mathematical Optimization, and Scalable Systems.
    </text>
  </g>

  <!-- Metrics / Credentials Pills -->
  <g transform="translate(120, 440)">
    <!-- Pill 1: GATE -->
    <g transform="translate(0, 0)">
      <rect width="210" height="52" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="20" y="24" fill="#64D2FF" font-size="14" font-weight="800" font-family="ui-monospace, monospace">GATE CSE 2025</text>
      <text x="20" y="40" fill="#8E8E93" font-size="11" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif">AIR 10,139 (Top ~6%)</text>
    </g>

    <!-- Pill 2: Amazon MLSS -->
    <g transform="translate(225, 0)">
      <rect width="225" height="52" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="20" y="24" fill="#FF9F0A" font-size="14" font-weight="800" font-family="ui-monospace, monospace">Amazon MLSS 2024</text>
      <text x="20" y="40" fill="#8E8E93" font-size="11" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif">Selected Fellowship Cohort</text>
    </g>

    <!-- Pill 3: Flagship System -->
    <g transform="translate(465, 0)">
      <rect width="225" height="52" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="20" y="24" fill="#30D158" font-size="14" font-weight="800" font-family="ui-monospace, monospace">1,200 MW Optimizer</text>
      <text x="20" y="40" fill="#8E8E93" font-size="11" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif">24h LP/MILP Grid Dispatch</text>
    </g>

    <!-- Pill 4: Live URL -->
    <g transform="translate(705, 0)">
      <rect width="235" height="52" rx="14" fill="rgba(10,132,255,0.12)" stroke="rgba(10,132,255,0.35)" stroke-width="1"/>
      <text x="20" y="24" fill="#FFFFFF" font-size="14" font-weight="800" font-family="ui-monospace, monospace">thenovember22.github.io</text>
      <text x="20" y="40" fill="#64D2FF" font-size="11" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif">Interactive Engineering Portfolio</text>
    </g>
  </g>
</svg>